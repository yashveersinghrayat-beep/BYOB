<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="60%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd257"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Gold Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Luxury Faceted Hexagon / Gem (ONYX) -->
  <g filter="url(#glow)">
    <polygon points="256,76 396,156 396,316 256,396 116,316 116,156" 
      fill="#141824" 
      stroke="url(#goldGrad)" 
      stroke-width="10" 
      stroke-linejoin="round"/>
  </g>

  <!-- Gem Inner Accent Lines -->
  <line x1="256" y1="76" x2="256" y2="396" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="116" y1="156" x2="396" y2="316" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="116" y1="316" x2="396" y2="156" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Central Monarch Monogram 'B' for BYOB -->
  <text x="256" y="278" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="160" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    letter-spacing="-4"
    filter="url(#glow)">B</text>

  <!-- Subtle Fork & Wine Glass / Bottle Silhouette at Top -->
  <g fill="#ffd257" opacity="0.9" transform="translate(244, 102) scale(0.6)">
    <circle cx="20" cy="12" r="6"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="348" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="28" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="8">ONYX POS</text>

  <text x="256" y="440" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="700" 
    font-size="20" 
    fill="#f59e0b" 
    text-anchor="middle" 
    letter-spacing="5">BYOB INDIRAPURAM</text>
</svg>